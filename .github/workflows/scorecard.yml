name: OpenSSF Scorecard

# Evalúa las buenas prácticas de seguridad del repositorio (acciones fijadas, permisos, protección de ramas...).
# Los resultados quedan en la pestaña Security. NO se publican fuera del repositorio (publish_results: false).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: scorecard.sarif
