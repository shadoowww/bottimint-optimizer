name: Release

# Se ejecuta al subir una etiqueta de versión:  git tag v1.1.0 && git push origin v1.1.0
#
# Seguridad de la cadena de publicación:
#  - Las acciones van fijadas por commit (un tag se puede mover; un commit no). Dependabot propone las actualizaciones.
#  - Se compila en un trabajo SIN permisos de escritura: ni pip ni PyInstaller ven un token que pueda publicar.
#  - Las dependencias de compilación van con versión y SHA256 exactos (requirements-build.txt).
#  - Solo el trabajo "publicar", que no instala ni ejecuta nada del proyecto, puede escribir la release y atestar.
#
# Ensayo sin publicar: en la pestaña Actions > Release > "Run workflow". Compila, sube el .exe, lo vuelve a bajar y
# comprueba su SHA256 en un trabajo sin permisos de escritura. No atesta ni publica nada. Sirve para probar cambios en
# esta cadena (por ejemplo, actualizaciones de las acciones) antes de crear una etiqueta.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar el .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Compilar .exe
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r requirements-build.txt
          pyinstaller --onefile --noconsole --uac-admin --name BottiMint run.py
      - name: Calcular SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/BottiMint.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BottiMint.exe" | Out-File -Encoding ascii dist/BottiMint.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BottiMint
          path: |
            dist/BottiMint.exe
            dist/BottiMint.exe.sha256
          if-no-files-found: error

  ensayo:
    name: Ensayo (no publica nada)
    if: github.event_name == 'workflow_dispatch'
    needs: compilar
    runs-on: ubuntu-latest # sin bloque de permisos propio: hereda el de solo lectura
    steps:
      # los dos primeros pasos de "publicar", idénticos (una prueba verifica que sigan iguales)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BottiMint
          path: dist
      - name: Comprobar que el .exe recibido coincide con su SHA256
        run: cd dist && tr -d '\r' < BottiMint.exe.sha256 | sha256sum --check --strict -

  publicar:
    name: Atestar y publicar
    if: github.event_name == 'push' # solo al subir una etiqueta: una ejecución manual nunca publica
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publicar la release
      id-token: write      # firmar la atestación de procedencia
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BottiMint
          path: dist
      - name: Comprobar que el .exe recibido coincide con su SHA256
        run: cd dist && tr -d '\r' < BottiMint.exe.sha256 | sha256sum --check --strict -
      - name: Atestación de procedencia (prueba criptográfica de que este .exe salió de este repositorio)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/BottiMint.exe
      - name: Publicar release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/BottiMint.exe
            dist/BottiMint.exe.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
