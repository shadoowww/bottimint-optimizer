name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: la CI no necesita escribir nada en el repositorio.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (sin pantalla)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -v
      - name: Tests con pantalla virtual (xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m unittest discover -s tests -t . -v
      - name: Que la documentación generada esté al día
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python scripts/generar_docs.py
          git diff --exit-code docs/NIVELES.md docs/PROGRAMAS.md

  compilacion:
    name: Compilar el .exe (sin publicar)
    runs-on: windows-latest
    steps:
      # los mismos pasos que la release, para enterarse de un fallo ANTES de crear la etiqueta
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compilar con las dependencias fijadas por hash
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r requirements-build.txt
          pyinstaller --onefile --noconsole --uac-admin --name BottiMint run.py

  seguridad:
    name: Análisis de seguridad (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --only-binary=:all: --no-deps -r requirements-ci.txt
      - name: Bandit (falla ante hallazgos de severidad media o alta)
        run: bandit -r bottimint -ll
